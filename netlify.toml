[[headers]]
  for = "/**/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html.gz"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"